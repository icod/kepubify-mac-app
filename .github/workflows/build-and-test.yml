name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Install Homebrew dependencies
        run: |
          brew install kepubify
          
      - name: Build the app
        run: |
          cd ${{ github.workspace }}
          xcodebuild -project KepubifyMacApp.xcodeproj -scheme KepubifyMacApp -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Run tests
        run: |
          cd ${{ github.workspace }}
          xcodebuild -project KepubifyMacApp.xcodeproj -scheme KepubifyMacApp -configuration Debug -destination 'platform=macOS' test CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KepubifyMacApp
          path: |
            **/Build/Products/Release/KepubifyMacApp.app
            **/DerivedData/Build/Products/Release/KepubifyMacApp.app
