name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0
          
      - name: Install Fastlane
        run: |
          cd ${{ github.workspace }}
          bundle install
          
      - name: Install Homebrew dependencies
        run: |
          brew install kepubify
          
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Build the app
        run: |
          cd ${{ github.workspace }}
          bundle exec fastlane build
          
      - name: Run tests
        run: |
          cd ${{ github.workspace }}
          bundle exec fastlane test
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: fastlane/test_output/
          
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: KepubifyMacApp
          path: |
            **/Build/Products/Release/KepubifyMacApp.app
            **/DerivedData/Build/Products/Release/KepubifyMacApp.app
