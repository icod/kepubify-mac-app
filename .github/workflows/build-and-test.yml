name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Install Homebrew dependencies
        run: |
          brew install kepubify
          
      - name: Build the app
        run: |
          cd ${{ github.workspace }}
          swift build -c release --arch arm64 --arch x86_64
          
      - name: Run tests
        run: |
          cd ${{ github.workspace }}
          swift test -c release --arch arm64 --arch x86_64
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/arm64-apple-macosx/release/
          
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KepubifyMacApp
          path: |
            .build/arm64-apple-macosx/release/KepubifyMacApp
            .build/x86_64-apple-macosx/release/KepubifyMacApp
